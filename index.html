<title>Trading Dashboard</title><style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--muted:#6b7480;--line:#d9dde2;--accent:#2f6fdb;--bad:#c0392b}

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:d64(B.salt),iterations:B.iter,hash:"SHA-256"},m,{name:"AES-GCM",length:256},true,["decrypt"]);}
async function open_(key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d64(B.iv)},key,d64(B.ct));
 const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
const LS="dash_key_"+B.salt;
(async()=>{try{const raw=localStorage.getItem(LS);if(raw){const k=await crypto.subtle.importKey("raw",d64(raw),"AES-GCM",true,["decrypt"]);await open_(k);}}catch(e){try{localStorage.removeItem(LS)}catch(_){}}})();
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const err=document.getElementById("err");err.textContent="Unlocking…";
 try{const k=await keyFrom(document.getElementById("pw").value);
  if(document.getElementById("rem").checked){try{const raw=new Uint8Array(await crypto.subtle.exportKey("raw",k));
   localStorage.setItem(LS,btoa(String.fromCharCode(...raw)));}catch(_){}}
  await open_(k);}catch(x){err.textContent="Wrong password.";}};
</script></body></html>
